apiVersion: v1
kind: Namespace
metadata:
  name: prometheus-rag
  labels:
    name: prometheus-rag
---
apiVersion: v1
kind: Secret
metadata:
  name: prag-secrets
  namespace: prometheus-rag
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # Use: echo -n "your-actual-api-key" | base64
  llm-api-key: ""  # Replace with base64 encoded API key
  prometheus-token: ""  # Optional prometheus token (base64 encoded)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prag-config
  namespace: prometheus-rag
data:
  PRAG_DEBUG: "false"
  PRAG_HOST: "0.0.0.0"
  PRAG_PORT: "8080"
  PRAG_PROMETHEUS_ADDRESS: "http://prometheus.monitoring.svc.cluster.local:9090"
  PRAG_PROMETHEUS_REFRESH_RATE_MINUTES: "10"
  PRAG_VECTORDB_PROVIDER: "qdrant"
  PRAG_VECTORDB_COLLECTION: "prag-metrics"
  PRAG_VECTORDB_ENCODER_DIR: "/app/models"
  PRAG_VECTORDB_QDRANT_HOST: "qdrant.prometheus-rag.svc.cluster.local"
  PRAG_VECTORDB_QDRANT_PORT: "6334"
  PRAG_LLM_BASE_URL: "http://llm-service.ai.svc.cluster.local:8080/v1/"
  PRAG_LLM_MODEL: "granite-3.1-8b-instruct"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-rag
  namespace: prometheus-rag
  labels:
    app: prometheus-rag
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: prometheus-rag
  template:
    metadata:
      labels:
        app: prometheus-rag
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: prometheus-rag
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: prometheus-rag
        image: prometheus-rag:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: prag-config
        env:
        - name: PRAG_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: prag-secrets
              key: llm-api-key
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: prag-models-pvc
      - name: tmp-volume
        emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-rag
  namespace: prometheus-rag
  labels:
    app: prometheus-rag
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: prometheus-rag
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-rag
  namespace: prometheus-rag
  labels:
    app: prometheus-rag
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: prometheus-rag
  name: prometheus-rag-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-rag-rolebinding
  namespace: prometheus-rag
subjects:
- kind: ServiceAccount
  name: prometheus-rag
  namespace: prometheus-rag
roleRef:
  kind: Role
  name: prometheus-rag-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prag-models-pvc
  namespace: prometheus-rag
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
